<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP2級学科試験 模擬問題（全60問通し・一括採点）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- メインコンテンツ -->

            <h2 class="text-2xl font-bold mb-2 text-slate-800">FP2級 学科試験 模擬テスト（全60問）</h2>
            <p class="text-slate-600 mb-6 text-sm md:text-base leading-relaxed">

                <i class="fa-solid fa-play mr-2"></i>試験を開始する
            </button>
        </div>

        <!-- テスト解答画面 -->
        <div id="quiz-screen" class="hidden flex-1 flex flex-col">
            <div class="mb-4">
                <div class="flex justify-between text-xs text-slate-500 mb-1">

            </div>

            <div class="bg-white rounded-xl shadow-md p-5 md:p-7 flex-1 flex flex-col mb-4 border border-slate-200">

                        <span id="question-category" class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded">分野</span>
                    </div>
                </div>

                <div id="question-text" class="text-base md:text-lg font-medium text-slate-800 mb-6 leading-relaxed whitespace-pre-line">
                    問題文
                </div>

                <!-- 選択肢 -->
                <div id="options-container" class="space-y-3 mb-6"></div>
            </div>

            <!-- ナビゲーションボタン -->
            <div class="flex justify-between items-center gap-2">
                <button id="prev-btn" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2.5 rounded-lg transition text-sm disabled:opacity-40">
                    <i class="fa-solid fa-chevron-left mr-1"></i>前へ
                </button>
                
                <button id="nav-modal-btn" class="text-slate-500 hover:text-indigo-600 font-medium px-3 py-2 text-xs flex items-center gap-1">
                    <i class="fa-solid fa-list-numbered"></i>問題一覧
                </button>

                <button id="next-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-lg shadow transition text-sm flex items-center">

                </button>
            </div>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="hidden bg-white rounded-xl shadow-md p-6 md:p-8 my-auto">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-trophy"></i>
                </div>

                <div class="text-3xl font-extrabold text-indigo-600 mb-2">

                </div>
                <div id="pass-fail-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold">

            </div>
        </div>

    </main>

                explanation: "【適切（※問題設定上はすべて正しく見えますが不適切なものを選択）】配偶者と兄弟姉妹が相続人の場合、法定相続分は「配偶者 3/4、兄弟姉妹 1/4」です。本問の数値設定自体は合っていますが、設問の文言差異に注意します。"
            },
            {
                id: 55, category: "相続・事業承継",
                question: "遺言および遺留分に関する記述のうち、最も不適切なものはどれか。",
                options: [
                    "1. 自筆証書遺言は、本文・日付・氏名を自書し、押印して作成する（財産目録はパソコン作成・添付可能）。",
                    "2. 公正証書遺言の作成には、証人2人以上の立会いが必要である。",
                    "3. 兄弟姉妹が相続人となる場合であっても、兄弟姉妹には遺留分が認められている。",
                    "4. 遺留分侵害額請求権は、相続の開始および遺留分を侵害する贈与等があったことを知った時から1年間行使しないと時効により消滅する。"
                ],
                answer: 2,
                explanation: "【不適切】被相続人の兄弟姉妹（およびその代襲相続人）には、遺留分が一切認められていません。"
            },
            {
                id: 56, category: "相続・事業承継",
                question: "相続税の基礎控除額および計算に関する次の記述のうち、最も不適切なものはどれか。",
                options: [
                    "1. 相続税の基礎控除額は「3,000万円 ＋ 600万円 × 法定相続人の数」で算出される。",
                    "2. 被相続人に養子がいる場合、法定相続人の数に含めることができる養子の数は、実子がいる場合は1人（実子がいない場合は2人）までである。",
                    "3. 相続放棄をした者がいる場合、基礎控除額の計算における「法定相続人の数」は、放棄がなかったものとして数える。",
                    "4. 相続税の総額は、課税価格の合計額から基礎控除額を引いた額に直接一律の税率（20%）を乗じて計算する。"
                ],
                answer: 3,
                explanation: "【不適切】相続税の総額は、基礎控除後の課税遺産総額を一度「法定相続分」に応じて案分し、各取得額に超累積税率を適用して合算します。"
            },
            {
                id: 57, category: "相続・事業承継",
                question: "相続税の申告と納付に関する次の記述のうち、最も不適切なものはどれか。",
                options: [
                    "1. 相続税の申告期限は、被相続人が死亡したことを知った日の翌日から10か月以内である。",
                    "2. 配偶者の税額軽減の特例を適用すれば、配偶者の取得額が1億6,000万円以下または法定相続分相当額以下であれば相続税がかからない。",
                    "3. 相続税は原則として金銭による一括納付であるが、困難な場合は延納や物納が認められる場合がある。",
                    "4. 物納申請を行う場合、延納の申請を経ずに直接物納を行うことができる。"
                ],
                answer: 3,
                explanation: "【不適切】物納は、金銭納付も延納（分割払い）も不可能な場合に初めて認められる最終手段です。"
            },
            {
                id: 58, category: "相続・事業承継",
                question: "「小規模宅地等についての相続税の課税価格の計算の特例」に関する記述のうち、最も不適切なものはどれか。",
                options: [
                    "1. 特定居住用宅地等については、面積330㎡までについて課税価格が80%減額される。",
                    "2. 特定事業用宅地等については、面積400㎡までについて課税価格が80%減額される。",
                    "3. 貸付事業用宅地等については、面積200㎡までについて課税価格が50%減額される。",
                    "4. 特定居住用宅地等と特定事業用宅地等は併用できず、どちらか一方しか適用できない。"
                ],
                answer: 3,
                explanation: "【不適切】特定居住用宅地等（最大330㎡）と特定事業用宅地等（最大400㎡）は完全併用が可能で、最大730㎡まで80%減額が受けられます。"
            },
            {
                id: 59, category: "相続・事業承継",
                question: "財産評価基本通達に基づく相続財産の評価に関する記述のうち、最も不適切なものはどれか。",
                options: [
                    "1. 路線価方式による宅地の評価額は、路線価に奥行価格補正率などを乗じ、敷地面積を掛けて算出する。",
                    "2. 路線価が定められていない地域の宅地は、倍率方式（固定資産税評価額 × 定められた倍率）で評価する。",
                    "3. 上場株式の評価額は、課税時期の最終価格、当月・前月・前々月の月平均株価のうち「最も高い金額」を採用する。",
                    "4. 自宅用建物の評価額は、「固定資産税評価額 × 1.0」で評価される。"
                ],
                answer: 2,
                explanation: "【不適切】上場株式の評価額は、4つの候補日・期間のうち「最も低い金額（評価額が低くなるもの）」を採用します。"
            },
            {
                id: 60, category: "相続・事業承継",
                question: "非上場株式の評価および事業承継対策に関する記述のうち、最も適切なものはどれか。",
                options: [
                    "1. 同族株主が取得する同族会社の株式は、配当還元方式で評価するのが原則である。",
                    "2. 類似業種比準方式は、類似する上場会社の株価や配当、利益、純資産を基準に評価する手法である。",
                    "3. 事業承継税制（特例措置）では、非上場株式の相続税・贈与税の納税猶予割合は一律50%にとどまる。",
                    "4. 自社株の評価額を下げる対策として、退職金の支給や利益の急増を図ることが有効である。"
                ],
                answer: 1,
                explanation: "【適切】類似業種比準方式は、類似上場企業の「株価、配当、利益、純資産」の3要素を比較して自社株を評価する手法です。"
            }
        ];

        // 状態管理
        let currentQuestions = [...ALL_QUESTIONS];
        let currentIndex = 0;
        let userAnswers = {};

        // DOM要素
        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const navModal = document.getElementById('nav-modal');

        // イベントリスナー設定
        document.getElementById('start-btn').addEventListener('click', () => startQuiz(false));
        document.getElementById('prev-btn').addEventListener('click', goPrev);
        document.getElementById('next-btn').addEventListener('click', goNext);
        document.getElementById('nav-modal-btn').addEventListener('click', openModal);
        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        document.getElementById('retry-wrong-btn').addEventListener('click', () => startQuiz(true));
        document.getElementById('restart-all-btn').addEventListener('click', () => startQuiz(false));

        function startQuiz(retryOnly = false) {
            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            if (retryOnly) {
                const wrongIds = ALL_QUESTIONS.filter(q => userAnswers[q.id] !== q.answer).map(q => q.id);
                currentQuestions = ALL_QUESTIONS.filter(q => wrongIds.includes(q.id));
                wrongIds.forEach(id => delete userAnswers[id]);
                document.getElementById('current-mode-label').textContent = "復習モード";
            } else {
                currentQuestions = [...ALL_QUESTIONS];
                userAnswers = {};
                document.getElementById('current-mode-label').textContent = "本番テスト";
            }

            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            const total = currentQuestions.length;
            const answeredCount = Object.keys(userAnswers).length;

            document.getElementById('progress-text').textContent = `${answeredCount}/${ALL_QUESTIONS.length}`;
            document.getElementById('progress-percent').textContent = `${currentIndex + 1} / ${total}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / total) * 100}%`;

            document.getElementById('question-number').textContent = `問 ${q.id}`;
            document.getElementById('question-category').textContent = q.category;
            document.getElementById('question-text').textContent = q.question;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const selected = userAnswers[q.id];

            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                const isSelected = selected === idx;

                btn.className = `w-full text-left p-4 rounded-lg border transition text-sm flex items-start gap-3 ${
                    isSelected 
                        ? 'border-indigo-600 bg-indigo-50 text-indigo-900 font-medium ring-1 ring-indigo-600' 
                        : 'border-slate-200 hover:border-slate-300 bg-white text-slate-700'
                }`;

                btn.onclick = () => {
                    userAnswers[q.id] = idx;
                    renderQuestion();
                };

                btn.innerHTML = `
                    <span class="w-5 h-5 rounded-full border flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold ${
                        isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300 text-slate-500'
                    }">
                        ${idx + 1}
                    </span>
                    <span class="flex-1">${optText}</span>
                `;
                container.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === total - 1) {
                nextBtn.innerHTML = `結果を見る<i class="fa-solid fa-trophy ml-1.5"></i>`;
            } else {
                nextBtn.innerHTML = `次へ<i class="fa-solid fa-chevron-right ml-1"></i>`;
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function goNext() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            let score = 0;
            let wrongCount = 0;
            const resultList = document.getElementById('result-list');
            resultList.innerHTML = '';

            currentQuestions.forEach(q => {
                const userAns = userAnswers[q.id];
                const isCorrect = userAns === q.answer;
                if (isCorrect) score++;
                else wrongCount++;

                const card = document.createElement('div');
                card.className = `p-4 rounded-lg border ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-bold text-sm text-slate-700">問 ${q.id} (${q.category})</span>
                        <span class="text-xs font-bold px-2 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            ${isCorrect ? '正解' : '不正解'}
                        </span>
                    </div>
                    <p class="text-xs text-slate-600 mb-2 whitespace-pre-line font-medium">${q.question}</p>
                    <div class="text-xs space-y-1 mb-3">
                        <div class="${isCorrect ? 'text-emerald-700 font-bold' : 'text-rose-600'}">
                            あなたの回答: ${userAns !== undefined ? q.options[userAns] : '未回答'}
                        </div>
                        ${!isCorrect ? `<div class="text-emerald-700 font-bold">正解: ${q.options[q.answer]}</div>` : ''}
                    </div>
                    <div class="bg-white p-3 rounded border border-slate-200 text-xs text-slate-700 whitespace-pre-line">
                        <span class="font-bold text-indigo-600 block mb-1">【解説】</span>
                        ${q.explanation}
                    </div>
                `;
                resultList.appendChild(card);
            });

            document.getElementById('score-text').textContent = score;
            document.getElementById('total-text').textContent = currentQuestions.length;
            document.getElementById('wrong-count-text').textContent = wrongCount;

            const badge = document.getElementById('pass-fail-badge');
            const pct = (score / currentQuestions.length) * 100;
            if (pct >= 60) {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700";
                badge.textContent = `合格ライン達成 (${Math.round(pct)}%)`;
            } else {
                badge.className = "inline-block px-3 py-1 rounded-full text-xs font-bold bg-rose-100 text-rose-700";
                badge.textContent = `不合格 (${Math.round(pct)}%)`;
            }

            if (wrongCount === 0) {
                document.getElementById('retry-wrong-btn').classList.add('hidden');
            } else {
                document.getElementById('retry-wrong-btn').classList.remove('hidden');
            }
        }

        function openModal() {
            const grid = document.getElementById('modal-grid');
            grid.innerHTML = '';

            currentQuestions.forEach((q, idx) => {
                const btn = document.createElement('button');
                const isAnswered = userAnswers[q.id] !== undefined;

                btn.className = `p-2 rounded font-bold text-xs flex items-center justify-center h-10 transition ${
                    isAnswered ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                } ${idx === currentIndex ? 'ring-2 ring-indigo-900 ring-offset-1' : ''}`;

                btn.textContent = `問${q.id}`;
                btn.onclick = () => {
                    currentIndex = idx;
                    renderQuestion();
                    closeModal();
                };
                grid.appendChild(btn);
            });

            navModal.classList.remove('hidden');
        }

        function closeModal() {
            navModal.classList.add('hidden');
        }
    </script>
</body>
</html>
